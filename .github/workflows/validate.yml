name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ripgrep

      - name: Validate scaffold
        run: ./deploy/install.sh validate

      - name: Render menu homepage
        run: ./deploy/install.sh menu | sed -n '1,120p'
